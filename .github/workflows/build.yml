name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Organizar pastas
        run: |
          mkdir -p app/src/main/java/com/thek/cliente
          mv *.kt app/src/main/java/com/thek/cliente/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThekCliente
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThekCliente.apk
          gh release create "v${{ github.run_number }}" ThekCliente.apk --title "Thek Cliente v${{ github.run_number }}" --notes "APK de teste"

name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Organizar pastas
        run: |
          mkdir -p app/src/main/java/com/thek/cliente
          mv *.kt app/src/main/java/com/thek/cliente/
          mv AndroidManifest.xml app/src/main/
          mv app-build.gradle.kts app/build.gradle.kts
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "${{ github.run_number }}"/' app/build.gradle.kts
      - name: Restaurar chave de assinatura
        uses: actions/cache@v4
        with:
          path: keystore/thek.jks
          key: thek-keystore-v1
      - name: Criar chave se nao existir
        run: |
          mkdir -p keystore
          if [ ! -f keystore/thek.jks ]; then
            keytool -genkeypair -keystore keystore/thek.jks -storetype PKCS12 -alias thek -keyalg RSA -keysize 2048 -validity 36500 -storepass thekpass123 -keypass thekpass123 -dname "CN=Thek Cliente, O=Thek, C=BR"
          fi
      - name: Criar icone
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0E1320" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#40A78BFA" android:pathData="M54,54m-38,0a38,38 0 1,0 76,0a38,38 0 1,0 -76,0"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#6EE7F9" android:pathData="M35,34h38v11h-13.5v31h-11v-31h-13.5z"/>
          </vector>
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThekCliente
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ThekCliente.apk
          gh release create "v${{ github.run_number }}" ThekCliente.apk --title "Thek Cliente v${{ github.run_number }}" --notes "APK de teste"
